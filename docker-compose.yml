services:
  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=silkhat
      - POSTGRES_USER=silkhat
      - POSTGRES_PASSWORD=silkhat
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silkhat -d silkhat"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: src/SilkHat.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      - ConnectionStrings__SilkHat=Host=postgres;Port=5432;Database=silkhat;Username=silkhat;Password=silkhat
      - REPO_ROOT=/repos
    volumes:
      - ${REPO_ROOT:?Set REPO_ROOT to a host path}:/repos
  ui:
    build:
      context: .
      dockerfile: src/SilkHat.Ui/Dockerfile
    depends_on:
      - api
    ports:
      - "10080:80"
  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "10081:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
volumes:
  postgres-data:
  pgadmin-data:
