services:
  api:
    build:
      context: .
      dockerfile: src/SilkHat.Api/Dockerfile
    ports:
      - "18080:8080"
    environment:
      - ConnectionStrings__SilkHat=Data Source=/data/silkhat.db
      - REPO_ROOT=/repos
    volumes:
      - silkhat-data:/data
      - ${REPO_ROOT:?Set REPO_ROOT to a host path}:/repos
  ui:
    build:
      context: .
      dockerfile: src/SilkHat.Ui/Dockerfile
    depends_on:
      - api
    ports:
      - "10080:80"
volumes:
  silkhat-data:
